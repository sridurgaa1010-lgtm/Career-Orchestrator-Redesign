openapi: 3.1.0
info:
  title: Career Orchestrator API
  description: Contract v1.0. Mock and real backend MUST expose identical paths, schemas
    and status codes.
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - meta
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/meta:
    get:
      tags:
      - meta
      summary: Meta
      operationId: meta_api_v1_meta_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/profiles:
    post:
      tags:
      - profiles
      summary: Create Profile
      operationId: create_profile_api_v1_profiles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerProfileInput'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /api/v1/profiles/{profile_id}:
    get:
      tags:
      - profiles
      summary: Get Profile
      operationId: get_profile_api_v1_profiles__profile_id__get
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerProfile'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
    put:
      tags:
      - profiles
      summary: Update Profile
      operationId: update_profile_api_v1_profiles__profile_id__put
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerProfileInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerProfile'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
    delete:
      tags:
      - profiles
      summary: Delete Profile
      operationId: delete_profile_api_v1_profiles__profile_id__delete
      parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
          title: Profile Id
      responses:
        '204':
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/workflows:
    post:
      tags:
      - workflows
      summary: Start
      operationId: start_api_v1_workflows_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowState'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /api/v1/workflows/{workflow_id}:
    get:
      tags:
      - workflows
      summary: Get Wf
      operationId: get_wf_api_v1_workflows__workflow_id__get
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowState'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/workflows/{workflow_id}/skills/confirmation:
    post:
      tags:
      - workflows
      summary: Confirm
      operationId: confirm_api_v1_workflows__workflow_id__skills_confirmation_post
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillConfirmationRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowState'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/workflows/{workflow_id}/role-selection:
    post:
      tags:
      - workflows
      summary: Select
      operationId: select_api_v1_workflows__workflow_id__role_selection_post
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSelectionRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowState'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/workflows/{workflow_id}/stages/{stage}/retry:
    post:
      tags:
      - workflows
      summary: Retry
      operationId: retry_api_v1_workflows__workflow_id__stages__stage__retry_post
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      - name: stage
        in: path
        required: true
        schema:
          enum:
          - extract_skills
          - confirm_skills
          - match_roles
          - select_role
          - learning_plan
          - employer_readiness
          - bias_audit
          - compose_result
          type: string
          title: Stage
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowState'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/workflows/{workflow_id}/results:
    get:
      tags:
      - workflows
      summary: Results
      operationId: results_api_v1_workflows__workflow_id__results_get
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResults'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/audits:
    post:
      tags:
      - audits
      summary: Run Audit
      operationId: run_audit_api_v1_audits_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiasAuditResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
  /api/v1/audits/{audit_id}:
    get:
      tags:
      - audits
      summary: Get Audit
      operationId: get_audit_api_v1_audits__audit_id__get
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          type: string
          title: Audit Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiasAuditResult'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/audits/{audit_id}/review:
    put:
      tags:
      - audits
      summary: Review
      operationId: review_api_v1_audits__audit_id__review_put
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          type: string
          title: Audit Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiasAuditResult'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/roles:
    get:
      tags:
      - reference
      summary: Roles
      operationId: roles_api_v1_roles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RoleProfile'
                type: array
                title: Response Roles Api V1 Roles Get
  /api/v1/roles/{role_id}:
    get:
      tags:
      - reference
      summary: Role
      operationId: role_api_v1_roles__role_id__get
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          title: Role Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleProfile'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Unprocessable Content
  /api/v1/skills:
    get:
      tags:
      - reference
      summary: Skills
      operationId: skills_api_v1_skills_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
          default: ''
          title: Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    APIError:
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - CONSENT_REQUIRED
          - NOT_FOUND
          - CONFLICT_STATE
          - STAGE_FAILED
          - LLM_UNAVAILABLE
          - LLM_SCHEMA_VIOLATION
          - TIMEOUT
          - RATE_LIMITED
          - INTERNAL_ERROR
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        request_id:
          type: string
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - retryable
      - request_id
      title: APIError
    APIErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/APIError'
      additionalProperties: false
      type: object
      required:
      - error
      title: APIErrorResponse
    Achievement:
      properties:
        text:
          type: string
          title: Text
        evidence_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence Ids
        needs_user_input:
          items:
            type: string
          type: array
          title: Needs User Input
          default: []
      additionalProperties: false
      type: object
      required:
      - text
      - evidence_ids
      title: Achievement
    AddedSkill:
      properties:
        skill_id:
          type: string
          title: Skill Id
        level:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Level
        note:
          anyOf:
          - type: string
            maxLength: 240
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - skill_id
      - level
      title: AddedSkill
    AuditFlag:
      properties:
        variant_id:
          type: string
          title: Variant Id
        metric:
          type: string
          title: Metric
        observed:
          type: number
          title: Observed
        threshold:
          type: number
          title: Threshold
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - variant_id
      - metric
      - observed
      - threshold
      - message
      title: AuditFlag
    AuditRequest:
      properties:
        profile_id:
          type: string
          title: Profile Id
        repeats:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Repeats
          default: 1
        include_proxy_cues:
          type: boolean
          title: Include Proxy Cues
          default: true
      additionalProperties: false
      type: object
      required:
      - profile_id
      title: AuditRequest
    AuditVariantResult:
      properties:
        variant_id:
          type: string
          title: Variant Id
        cue_set:
          type: string
          enum:
          - baseline
          - direct_age_cue
          - proxy_experience_years
          title: Cue Set
        label:
          type: string
          title: Label
        skills_jaccard:
          type: number
          title: Skills Jaccard
        top3_overlap:
          type: integer
          title: Top3 Overlap
        kendall_tau:
          type: number
          title: Kendall Tau
        max_abs_score_delta:
          type: number
          title: Max Abs Score Delta
        plan_hours_delta:
          type: number
          title: Plan Hours Delta
        lexicon_hits:
          type: integer
          title: Lexicon Hits
      additionalProperties: false
      type: object
      required:
      - variant_id
      - cue_set
      - label
      - skills_jaccard
      - top3_overlap
      - kendall_tau
      - max_abs_score_delta
      - plan_hours_delta
      - lexicon_hits
      title: AuditVariantResult
    BiasAuditResult:
      properties:
        audit_id:
          type: string
          title: Audit Id
        profile_id:
          type: string
          title: Profile Id
        status:
          type: string
          enum:
          - RUNNING
          - SUCCEEDED
          - FAILED
          title: Status
        created_at:
          type: string
          title: Created At
        mode:
          type: string
          enum:
          - deterministic_only
          - llm_extraction
          - replay
          title: Mode
        repeats:
          type: integer
          title: Repeats
        variants:
          items:
            $ref: '#/components/schemas/AuditVariantResult'
          type: array
          title: Variants
        thresholds:
          additionalProperties:
            type: number
          type: object
          title: Thresholds
        flags:
          items:
            $ref: '#/components/schemas/AuditFlag'
          type: array
          title: Flags
        verdict:
          type: string
          enum:
          - pass
          - flag
          - inconclusive
          title: Verdict
        reviewer:
          $ref: '#/components/schemas/Reviewer'
        limitations:
          items:
            type: string
          type: array
          title: Limitations
      additionalProperties: false
      type: object
      required:
      - audit_id
      - profile_id
      - status
      - created_at
      - mode
      - repeats
      - variants
      - thresholds
      - flags
      - verdict
      - reviewer
      - limitations
      title: BiasAuditResult
    CareerProfile:
      properties:
        consent:
          $ref: '#/components/schemas/Consent'
        language:
          type: string
          const: en
          title: Language
          default: en
        display_name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Display Name
        summary_text:
          anyOf:
          - type: string
            maxLength: 1500
          - type: 'null'
          title: Summary Text
        work_entries:
          items:
            $ref: '#/components/schemas/WorkEntry'
          type: array
          maxItems: 10
          minItems: 1
          title: Work Entries
        preferences:
          $ref: '#/components/schemas/Preferences'
          default:
            interest_tags: []
        profile_id:
          type: string
          title: Profile Id
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        is_synthetic:
          type: boolean
          title: Is Synthetic
          default: false
      additionalProperties: false
      type: object
      required:
      - consent
      - work_entries
      - profile_id
      - created_at
      - updated_at
      title: CareerProfile
    CareerProfileInput:
      properties:
        consent:
          $ref: '#/components/schemas/Consent'
        language:
          type: string
          const: en
          title: Language
          default: en
        display_name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Display Name
        summary_text:
          anyOf:
          - type: string
            maxLength: 1500
          - type: 'null'
          title: Summary Text
        work_entries:
          items:
            $ref: '#/components/schemas/WorkEntry'
          type: array
          maxItems: 10
          minItems: 1
          title: Work Entries
        preferences:
          $ref: '#/components/schemas/Preferences'
          default:
            interest_tags: []
      additionalProperties: false
      type: object
      required:
      - consent
      - work_entries
      title: CareerProfileInput
    ClarifyingQuestion:
      properties:
        question_id:
          type: string
          title: Question Id
        text:
          type: string
          title: Text
        skill_ids:
          items:
            type: string
          type: array
          title: Skill Ids
      additionalProperties: false
      type: object
      required:
      - question_id
      - text
      - skill_ids
      title: ClarifyingQuestion
    Consent:
