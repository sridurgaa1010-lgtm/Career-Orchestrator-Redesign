components:
  schemas:
    AddedSkill:
      additionalProperties: false
      properties:
        level:
          maximum: 3.0
          minimum: 1.0
          title: Level
          type: integer
        skill_id:
          title: Skill Id
          type: string
      required:
      - skill_id
      - level
      title: AddedSkill
      type: object
    AgentStep:
      additionalProperties: false
      properties:
        agent:
          enum:
          - skills_discovery
          - market_intelligence
          - learning_pathway
          - inclusive_matching
          - bias_audit
          - human_in_the_loop
          title: Agent
          type: string
        created_at:
          title: Created At
          type: string
        input_summary:
          title: Input Summary
          type: string
        mode:
          title: Mode
          type: string
        output_summary:
          title: Output Summary
          type: string
        step:
          minimum: 1.0
          title: Step
          type: integer
        stopped_at_gate:
          title: Stopped At Gate
          type: boolean
      required:
      - step
      - agent
      - mode
      - input_summary
      - output_summary
      - stopped_at_gate
      - created_at
      title: AgentStep
      type: object
    AuditFlag:
      additionalProperties: false
      properties:
        message:
          title: Message
          type: string
        metric:
          title: Metric
          type: string
        observed:
          title: Observed
          type: number
        threshold:
          title: Threshold
          type: number
        variant_id:
          title: Variant Id
          type: string
      required:
      - variant_id
      - metric
      - observed
      - threshold
      - message
      title: AuditFlag
      type: object
    AuditMetrics:
      additionalProperties: false
      properties:
        kendall_tau:
          title: Kendall Tau
          type: number
        lexicon_hits:
          title: Lexicon Hits
          type: integer
        max_abs_score_delta:
          title: Max Abs Score Delta
          type: number
        plan_hours_delta:
          title: Plan Hours Delta
          type: number
        skills_jaccard:
          title: Skills Jaccard
          type: number
        top3_overlap:
          title: Top3 Overlap
          type: integer
      required:
      - skills_jaccard
      - top3_overlap
      - kendall_tau
      - max_abs_score_delta
      - plan_hours_delta
      - lexicon_hits
      title: AuditMetrics
      type: object
    AuditRequest:
      additionalProperties: false
      properties:
        canary:
          default: false
          description: 'Demo only: add a deliberately biased variant to prove the
            audit can catch bias'
          title: Canary
          type: boolean
      title: AuditRequest
      type: object
    AuditResult:
      additionalProperties: false
      properties:
        audit_id:
          title: Audit Id
          type: string
        canary:
          title: Canary
          type: boolean
        created_at:
          title: Created At
          type: string
        limitations:
          items:
            type: string
          title: Limitations
          type: array
        profile_id:
          title: Profile Id
          type: string
        review:
          anyOf:
          - $ref: '#/components/schemas/AuditReview'
          - type: 'null'
        status:
          enum:
          - pass
          - flagged
          title: Status
          type: string
        thresholds:
          additionalProperties:
            type: number
          title: Thresholds
          type: object
        variants:
          items:
            $ref: '#/components/schemas/AuditVariant'
          title: Variants
          type: array
      required:
      - audit_id
      - profile_id
      - status
      - canary
      - variants
      - thresholds
      - limitations
      - review
      - created_at
      title: AuditResult
      type: object
    AuditReview:
      additionalProperties: false
      properties:
        decision:
          title: Decision
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        reviewed_at:
          title: Reviewed At
          type: string
        reviewer:
          title: Reviewer
          type: string
      required:
      - reviewer
      - decision
      - note
      - reviewed_at
      title: AuditReview
      type: object
    AuditVariant:
      additionalProperties: false
      properties:
        cue:
          title: Cue
          type: string
        flags:
          items:
            $ref: '#/components/schemas/AuditFlag'
          title: Flags
          type: array
        metrics:
          $ref: '#/components/schemas/AuditMetrics'
        variant_id:
          title: Variant Id
          type: string
      required:
      - variant_id
      - cue
      - metrics
      - flags
      title: AuditVariant
      type: object
    Background:
      additionalProperties: false
      properties:
        barriers:
          items:
            enum:
            - time
            - money
            - confidence
            - device_internet
            - language
            - caring_duties
            - unsure_start
            type: string
          maxItems: 7
          title: Barriers
          type: array
        certifications:
          items:
            $ref: '#/components/schemas/CertItem'
          maxItems: 10
          title: Certifications
          type: array
        education:
          items:
            $ref: '#/components/schemas/EducationItem'
          maxItems: 5
          title: Education
          type: array
        languages:
          items:
            type: string
          maxItems: 8
          title: Languages
          type: array
        learning_formats:
          items:
            enum:
            - video
            - reading
            - hands_on
            - live
            type: string
          maxItems: 4
          title: Learning Formats
          type: array
        situation:
          anyOf:
          - enum:
            - promotion
            - switch_field
            - returning
            - cv_not_showing_skills
            - other
            type: string
          - type: 'null'
          title: Situation
        situations:
          description: All that apply; situation holds the first
          items:
            enum:
            - promotion
            - switch_field
            - returning
            - cv_not_showing_skills
            - other
            type: string
          maxItems: 5
          title: Situations
          type: array
        tools:
          items:
            type: string
          maxItems: 20
          title: Tools
          type: array
      title: Background
      type: object
    CVDocument:
      additionalProperties: false
      properties:
        file_name:
          title: File Name
          type: string
        profile_id:
          title: Profile Id
          type: string
        sections:
          items:
            type: string
          title: Sections
          type: array
        text:
          title: Text
          type: string
      required:
      - profile_id
      - file_name
      - text
      - sections
      title: CVDocument
      type: object
    CVFileRequest:
      additionalProperties: false
      properties:
        content_base64:
          description: PDF or Word (.docx) file, at most 2 MB before encoding
          maxLength: 2800000
          minLength: 8
          title: Content Base64
          type: string
        file_name:
          maxLength: 200
          minLength: 1
          title: File Name
          type: string
      required:
      - file_name
      - content_base64
      title: CVFileRequest
      type: object
    CVFileText:
      additionalProperties: false
      properties:
        pages:
          title: Pages
          type: integer
        text:
          title: Text
          type: string
        truncated:
          title: Truncated
          type: boolean
      required:
      - text
      - truncated
      - pages
      title: CVFileText
      type: object
    CVParseRequest:
      additionalProperties: false
      properties:
        text:
          description: Plain text of the CV
          maxLength: 20000
          minLength: 40
          title: Text
          type: string
      required:
      - text
      title: CVParseRequest
      type: object
    CVParseResponse:
      additionalProperties: false
      properties:
        certifications:
          items:
            $ref: '#/components/schemas/ParsedCert'
          title: Certifications
          type: array
        current_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Role
        education:
          items:
            $ref: '#/components/schemas/ParsedEducation'
          title: Education
          type: array
        ignored_lines:
          description: Lines about age, gender, years worked and similar that were
            dropped and never used
          minimum: 0.0
          title: Ignored Lines
          type: integer
        languages:
          items:
            type: string
          title: Languages
          type: array
        mode:
          enum:
          - rules
          - llm+rules
          title: Mode
          type: string
        skills:
          items:
            type: string
          title: Skills
          type: array
        tools:
          items:
            type: string
          title: Tools
          type: array
        warnings:
          items:
            type: string
          title: Warnings
          type: array
        work_examples:
          items:
            type: string
          title: Work Examples
          type: array
      required:
      - current_role
      - work_examples
      - skills
      - tools
      - certifications
      - education
      - languages
      - mode
      - ignored_lines
      - warnings
      title: CVParseResponse
      type: object
    CertItem:
      additionalProperties: false
      properties:
        issuer:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          title: Issuer
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: CertItem
      type: object
    Chapter:
      additionalProperties: false
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        done:
          title: Done
          type: boolean
        est_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Est Hours
        title:
          title: Title
          type: string
      required:
      - chapter_id
      - title
      - est_hours
      - done
      title: Chapter
      type: object
    ChapterTick:
      additionalProperties: false
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        done:
          title: Done
          type: boolean
      required:
      - chapter_id
      - done
      title: ChapterTick
      type: object
    ChaptersResponse:
      additionalProperties: false
      properties:
        chapters:
          items:
            $ref: '#/components/schemas/Chapter'
          title: Chapters
          type: array
        next_message:
          anyOf:
          - $ref: '#/components/schemas/NextMessage'
          - type: 'null'
        percent:
          title: Percent
          type: integer
        profile_id:
          title: Profile Id
          type: string
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        source:
          enum:
          - chapters
          - manual
          title: Source
          type: string
        step_order:
          title: Step Order
          type: integer
      required:
      - profile_id
      - step_order
      - resource_id
      - chapters
      - percent
      - source
      - next_message
      title: ChaptersResponse
      type: object
    ConfirmRequest:
      additionalProperties: false
      properties:
        added_skills:
          items:
            $ref: '#/components/schemas/AddedSkill'
          title: Added Skills
          type: array
        decisions:
          description: Exactly one decision per suggestion
          items:
            $ref: '#/components/schemas/Decision'
          title: Decisions
          type: array
      required:
      - decisions
      title: ConfirmRequest
      type: object
    ConfirmResponse:
      additionalProperties: false
      properties:
        confirmed_skills:
          items:
            $ref: '#/components/schemas/ConfirmedSkill'
          title: Confirmed Skills
          type: array
        profile_id:
          title: Profile Id
          type: string
        rejected_skill_ids:
          items:
            type: string
          title: Rejected Skill Ids
          type: array
      required:
      - profile_id
      - confirmed_skills
      - rejected_skill_ids
      title: ConfirmResponse
      type: object
    ConfirmedSkill:
      additionalProperties: false
      properties:
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          title: Evidence
          type: array
        level:
          maximum: 3.0
          minimum: 1.0
          title: Level
          type: integer
        name:
          title: Name
          type: string
        skill_id:
          title: Skill Id
          type: string
        source:
          enum:
          - declared
          - declared_alias
          - extracted
          - user_added
          title: Source
          type: string
      required:
      - skill_id
      - name
      - level
      - source
      - evidence
      title: ConfirmedSkill
      type: object
    Decision:
      additionalProperties: false
      properties:
        action:
          enum:
          - accept
          - edit
          - reject
          title: Action
          type: string
        level:
          anyOf:
          - maximum: 3.0
            minimum: 1.0
            type: integer
          - type: 'null'
          description: Required when action is edit
          title: Level
        suggestion_id:
          title: Suggestion Id
          type: string
      required:
      - suggestion_id
      - action
      title: Decision
      type: object
    DeclaredSkill:
      additionalProperties: false
      properties:
        level:
          description: 1 Beginner, 2 Intermediate, 3 Advanced (the worker's own statement)
          maximum: 3.0
          minimum: 1.0
          title: Level
          type: integer
        name:
          maxLength: 80
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - level
      title: DeclaredSkill
      type: object
    EducationItem:
      additionalProperties: false
      properties:
        field:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          title: Field
        institution:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          title: Institution
        level:
          enum:
          - school
          - grade10
          - grade12
          - diploma
          - bachelor
          - master
          - other
          title: Level
          type: string
      required:
      - level
      title: EducationItem
      type: object
    Evidence:
      additionalProperties: false
      properties:
        quote:
          description: Verbatim substring of one of the worker's work examples
          title: Quote
          type: string
        work_example_index:
          minimum: 0.0
          title: Work Example Index
          type: integer
      required:
      - quote
      - work_example_index
      title: Evidence
      type: object
    ExtractResponse:
      additionalProperties: false
      properties:
        extraction_mode:
          enum:
          - rules
          - llm+rules
          title: Extraction Mode
          type: string
        profile_id:
          title: Profile Id
          type: string
        suggestions:
          items:
            $ref: '#/components/schemas/SkillSuggestion'
          title: Suggestions
          type: array
        unmatched_declared:
          description: Declared skills with no scored equivalent; shown to the worker,
            not scored
          items:
            type: string
          title: Unmatched Declared
          type: array
        warnings:
          items:
            type: string
          title: Warnings
          type: array
      required:
      - profile_id
      - suggestions
      - unmatched_declared
      - extraction_mode
      title: ExtractResponse
      type: object
    FeatureScores:
      additionalProperties: false
      properties:
        learnability:
          title: Learnability
          type: number
        preference_fit:
          anyOf:
          - type: number
          - type: 'null'
          description: null when the worker gave no interests (feature dropped, weights
            renormalised)
          title: Preference Fit
        skill_coverage:
          title: Skill Coverage
          type: number
      required:
      - skill_coverage
      - preference_fit
      - learnability
      title: FeatureScores
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MarketResponse:
      additionalProperties: false
      properties:
        held:
          items:
            $ref: '#/components/schemas/MarketSkill'
          title: Held
          type: array
        next_skills:
          items:
            $ref: '#/components/schemas/MarketSkill'
          title: Next Skills
          type: array
        profile_id:
          title: Profile Id
          type: string
        roles_in_catalogue:
          title: Roles In Catalogue
          type: integer
        source_note:
          title: Source Note
          type: string
        top_role_ids:
          items:
            type: string
          title: Top Role Ids
          type: array
      required:
      - profile_id
      - roles_in_catalogue
      - top_role_ids
      - held
      - next_skills
      - source_note
      title: MarketResponse
      type: object
    MarketSkill:
      additionalProperties: false
      properties:
        mandatory_in:
          minimum: 0.0
          title: Mandatory In
          type: integer
        name:
          title: Name
          type: string
        roles_asking:
          description: How many roles in OUR catalogue list this skill
          minimum: 0.0
          title: Roles Asking
          type: integer
        skill_id:
          title: Skill Id
          type: string
      required:
      - skill_id
      - name
      - roles_asking
      - mandatory_in
      title: MarketSkill
      type: object
    MatchedSkill:
      additionalProperties: false
      properties:
        coverage:
          title: Coverage
          type: number
        evidence_quotes:
          items:
            type: string
          title: Evidence Quotes
          type: array
        name:
          title: Name
          type: string
        required_level:
          title: Required Level
          type: integer
        skill_id:
          title: Skill Id
          type: string
        user_level:
          title: User Level
          type: integer
      required:
      - skill_id
      - name
      - user_level
      - required_level
      - coverage
      - evidence_quotes
      title: MatchedSkill
      type: object
    MessageFeedback:
      additionalProperties: false
      properties:
        helpful:
          title: Helpful
          type: boolean
      required:
      - helpful
      title: MessageFeedback
      type: object
    Meta:
      additionalProperties: false
      properties:
        app_version:
          title: App Version
          type: string
        catalog:
          additionalProperties:
            type: integer
          title: Catalog
          type: object
        contract_version:
          title: Contract Version
          type: string
        disclaimers:
          items:
            type: string
          title: Disclaimers
          type: array
        extraction_mode:
          enum:
          - rules
          - llm+rules
          title: Extraction Mode
          type: string
        mode:
          enum:
          - replay
          - live
          title: Mode
          type: string
        resource_policy:
          additionalProperties:
            type: boolean
          title: Resource Policy
          type: object
        weights:
          additionalProperties:
            type: number
          title: Weights
          type: object
        weights_are_provisional:
          title: Weights Are Provisional
          type: boolean
      required:
      - app_version
      - contract_version
      - mode
      - extraction_mode
      - weights
      - weights_are_provisional
      - catalog
      - resource_policy
      - disclaimers
      title: Meta
      type: object
    Mission:
      additionalProperties: false
      properties:
        brief:
          title: Brief
          type: string
        chapter_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Chapter Title
        mission_id:
          title: Mission Id
          type: string
        order:
          title: Order
          type: integer
        percent:
          description: 0 not started, 50 started, 100 proof uploaded
          maximum: 100.0
          minimum: 0.0
          title: Percent
          type: integer
        proof_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Proof Name
        source:
          title: Source
          type: string
        status:
          enum:
          - open
          - locked
          - done
          - declined
          title: Status
          type: string
        title:
          title: Title
          type: string
      required:
      - mission_id
      - order
      - title
      - brief
      - source
      - chapter_title
      - status
      - percent
      - proof_name
      title: Mission
      type: object
    MissionDeclineResponse:
      additionalProperties: false
      properties:
        message:
          anyOf:
          - $ref: '#/components/schemas/NextMessage'
          - type: 'null'
          description: Encouragement for the worker, or null when messages are paused
        missions:
          $ref: '#/components/schemas/MissionsResponse'
      required:
      - missions
      - message
      title: MissionDeclineResponse
      type: object
    MissionsResponse:
      additionalProperties: false
      properties:
        missions:
          items:
            $ref: '#/components/schemas/Mission'
          title: Missions
          type: array
        profile_id:
          title: Profile Id
          type: string
        today_mission_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Today Mission Id
      required:
      - profile_id
      - missions
      - today_mission_id
      title: MissionsResponse
      type: object
    MotivationPrefs:
      additionalProperties: false
      properties:
        check_in:
          default: weekly
          enum:
          - daily
          - weekly
          - 'off'
          title: Check In
          type: string
        paused:
          default: false
          title: Paused
          type: boolean
        styles:
          description: One or more styles the worker chose; first is primary
          items:
            enum:
            - progress
            - goals
            - encouragement
            - accountability
            - challenge
            type: string
          maxItems: 5
          minItems: 1
          title: Styles
          type: array
      required:
      - styles
      title: MotivationPrefs
      type: object
    NextMessage:
      additionalProperties: false
      properties:
        event:
          enum:
          - start
          - step_done
          - halfway
          - behind
          - welcome_back
          - plan_done
          title: Event
          type: string
        message_id:
          title: Message Id
          type: string
        style:
          enum:
          - progress
          - goals
          - encouragement
          - accountability
          - challenge
          title: Style
          type: string
        suggested_action:
          enum:
          - none
          - share_summary
          title: Suggested Action
          type: string
        text:
          title: Text
          type: string
      required:
      - message_id
      - style
      - event
      - text
      - suggested_action
      title: NextMessage
      type: object
    ParsedCert:
      additionalProperties: false
      properties:
        issuer:
          anyOf:
          - type: string
          - type: 'null'
          title: Issuer
        name:
          title: Name
          type: string
      required:
      - name
      - issuer
      title: ParsedCert
      type: object
    ParsedEducation:
      additionalProperties: false
      properties:
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
        institution:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution
        level:
          anyOf:
          - enum:
            - school
            - grade10
            - grade12
            - diploma
            - bachelor
            - master
            - other
            type: string
          - type: 'null'
          title: Level
        line:
          title: Line
          type: string
      required:
      - line
      - level
      - field
      - institution
      title: ParsedEducation
      type: object
    PathCourse:
      additionalProperties: false
      properties:
        certificate:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Certificate
        cost:
          anyOf:
          - type: string
          - type: 'null'
          title: Cost
        covers:
          items:
            type: string
          title: Covers
          type: array
        decided_by:
          enum:
          - agent
          - rules
          title: Decided By
          type: string
        duration_text:
          title: Duration Text
          type: string
        est_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Est Hours
        level:
          anyOf:
          - enum:
            - beginner
            - intermediate
            - advanced
            type: string
          - type: 'null'
          title: Level
        level_basis:
          title: Level Basis
          type: string
        prerequisites:
          anyOf:
          - type: string
          - type: 'null'
          title: Prerequisites
        provider:
          title: Provider
          type: string
        rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Rating
        rating_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rating Count
        resource_id:
          title: Resource Id
          type: string
        title:
          title: Title
          type: string
        topics:
          description: Topics as listed on the course page
          items:
            type: string
          title: Topics
          type: array
        units:
          description: Modules or sections as listed on the course page
          items:
            type: string
          title: Units
          type: array
        url:
