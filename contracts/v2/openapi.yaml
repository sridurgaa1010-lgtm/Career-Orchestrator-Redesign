info:
  title: Career Orchestrator API
  version: '2.0'
openapi: 3.1.0
paths:
  /api/v1/audits/{aid}:
    get:
      operationId: read_audit_api_v1_audits__aid__get
      parameters:
      - in: path
        name: aid
        required: true
        schema:
          title: Aid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Read Audit
  /api/v1/audits/{aid}/review:
    post:
      operationId: review_audit_api_v1_audits__aid__review_post
      parameters:
      - in: path
        name: aid
        required: true
        schema:
          title: Aid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Review Audit
  /api/v1/cv/file:
    post:
      description: PDF or Word (.docx) CV to plain text. The text is shown to the
        person, who then reads it with POST /cv/parse. Nothing is stored.
      operationId: cv_file_api_v1_cv_file_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CVFileRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVFileText'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cv File
  /api/v1/cv/parse:
    post:
      operationId: cv_parse_api_v1_cv_parse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CVParseRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVParseResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cv Parse
  /api/v1/demo/personas:
    get:
      operationId: demo_personas_api_v1_demo_personas_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Demo Personas
  /api/v1/health:
    get:
      operationId: health_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Health
  /api/v1/meta:
    get:
      operationId: meta_api_v1_meta_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: Successful Response
      summary: Meta
  /api/v1/profiles:
    post:
      operationId: create_profile_api_v1_profiles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Profile
  /api/v1/profiles/{pid}:
    delete:
      operationId: delete_profile_api_v1_profiles__pid__delete
      parameters:
      - in: path
        name: pid
        required: true
        schema:
          title: Pid
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
